<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1b3a">
<title>Stamford Street Racers</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;position:fixed;overscroll-behavior:none;background:#0d1b3a;color:#fff;font-family:"Trebuchet MS",Verdana,Arial,sans-serif}
#c{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
.scr{position:absolute;left:0;top:0;right:0;bottom:0;display:none;z-index:10}
.scr.on{display:block}
button{font-family:inherit;color:#fff;border:0;outline:0;margin:0;cursor:pointer}
.btn{min-height:72px;min-width:72px;border-radius:22px;font-weight:900;font-size:30px;padding:0 26px;background:linear-gradient(#ffb930,#f47a00);box-shadow:0 6px 0 #a94f00,0 10px 18px rgba(0,0,0,.4);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a94f00}
.btn.blue{background:linear-gradient(#49b6ff,#1668e3);box-shadow:0 6px 0 #0c3f96,0 10px 18px rgba(0,0,0,.4)}
.btn.green{background:linear-gradient(#6fe06a,#1fa53a);box-shadow:0 6px 0 #0f6a22,0 10px 18px rgba(0,0,0,.4)}
.btn.off{background:linear-gradient(#8b93a6,#5d6475);box-shadow:0 6px 0 #3b4050}
.ib{position:absolute;width:72px;height:72px;border-radius:20px;font-size:32px;font-weight:900;background:rgba(10,20,50,.6);border:3px solid rgba(255,255,255,.55);padding:0;line-height:1}
.ib:active{background:rgba(255,255,255,.35)}
#mute{position:fixed;left:10px;top:10px;z-index:60}
.bl{position:absolute;left:14px;bottom:14px}.br{position:absolute;right:14px;bottom:14px}
/* title */
#title{background:linear-gradient(#2a6fd6,#16337a 55%,#0d1b3a);text-align:center}
#title h1{margin:7vh 0 0;font-size:13vh;line-height:1.02;font-weight:900;letter-spacing:1px;color:#ffd91a;text-shadow:0 .7vh 0 #c2410c,0 1.4vh 2vh rgba(0,0,0,.5)}
#title h1 span{display:block;color:#fff;font-size:8vh;text-shadow:0 .5vh 0 #1668e3,0 1vh 2vh rgba(0,0,0,.5)}
#title p{font-size:4.2vh;margin:2vh 0 0;opacity:.9}
#bPlay{position:absolute;left:50%;bottom:9vh;transform:translateX(-50%);font-size:9vh;min-height:20vh;padding:0 9vh;border-radius:6vh}
#bPlay:active{transform:translateX(-50%) translateY(4px)}
#troad{position:absolute;left:0;right:0;bottom:0;height:6vh;background:#333;border-top:1vh solid #ffd91a}
#tcar{position:absolute;bottom:3vh;font-size:11vh;animation:drive 6s linear infinite}
@keyframes drive{from{left:110%}to{left:-25%}}
/* map */
#map{background:#9ad873}
#mapsvg{position:absolute;left:0;top:0;width:100%;height:100%}
#mapT{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-size:5.4vh;font-weight:900;background:rgba(10,20,50,.78);padding:6px 22px;border-radius:18px;white-space:nowrap}
#mapStars{position:absolute;right:10px;top:10px;font-size:5.4vh;font-weight:900;background:rgba(10,20,50,.78);padding:6px 18px;border-radius:18px}
.pin{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;font-size:34px;font-weight:900;background:linear-gradient(#ff6b5e,#d81e2c);border:4px solid #fff;box-shadow:0 5px 10px rgba(0,0,0,.5);padding:0}
.pin.lock{background:linear-gradient(#9aa3b5,#5d6475)}
.pin.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
.pin i{position:absolute;left:84px;top:8px;font-style:normal;font-size:18px;line-height:1.25;text-align:left;white-space:nowrap;background:rgba(10,20,50,.8);padding:5px 10px;border-radius:10px;pointer-events:none}
.pin.lft i{left:auto;right:84px;text-align:right}
.pin i b{color:#ffd91a;font-size:20px}
/* garage */
#gname{position:absolute;left:50%;top:10px;transform:translateX(-50%);text-align:center;font-size:6.4vh;font-weight:900;white-space:nowrap;text-shadow:0 3px 6px #000}
#gname small{display:block;font-size:3.2vh;font-weight:400;opacity:.9}
#gBack{right:10px;top:10px;font-size:22px}
#gCols{position:absolute;left:10px;top:92px;width:158px}
.sw{width:72px;height:72px;border-radius:18px;border:4px solid rgba(255,255,255,.35);margin:0 7px 7px 0;float:left;padding:0}
.sw.sel{border-color:#fff;box-shadow:0 0 0 4px #ffd91a}
#gStats{position:absolute;right:10px;top:96px;width:230px;background:rgba(10,20,50,.72);border-radius:18px;padding:10px 14px}
.st{font-size:20px;font-weight:700;margin:4px 0 8px}
.st u{display:inline-block;width:26px;height:16px;border-radius:5px;margin-right:5px;background:rgba(255,255,255,.2);text-decoration:none}
.st u.f{background:#ffd91a}
#gWheel{width:100%;font-size:22px;margin-top:6px;padding:0 8px}
#gLock{position:absolute;left:50%;top:76%;transform:translate(-50%,-50%);font-size:5.5vh;font-weight:900;background:rgba(10,20,50,.85);padding:14px 28px;border-radius:24px;display:none;white-space:nowrap;text-align:center}
#gPrev,#gNext{position:absolute;bottom:14px;width:104px;height:92px;font-size:44px;padding:0}
#gPrev{left:14px}#gNext{left:132px}
#gGo{font-size:44px;min-height:92px;padding:0 40px}
#gNum{position:absolute;left:250px;bottom:36px;font-size:26px;font-weight:900;text-shadow:0 2px 4px #000}
/* hud */
#bPause{left:92px;top:10px}#bCam{left:174px;top:10px;font-size:30px}
#posBox{position:absolute;left:50%;top:6px;transform:translateX(-50%);text-align:center;text-shadow:0 3px 6px rgba(0,0,0,.8);pointer-events:none}
#pos{font-size:12vh;font-weight:900;color:#ffd91a;line-height:1}
#lap{font-size:4.4vh;font-weight:900}
#mini{position:absolute;right:10px;top:10px;width:24vh;height:24vh;min-width:120px;min-height:120px;background:rgba(10,20,50,.55);border-radius:18px;border:3px solid rgba(255,255,255,.5)}
#coinBox{position:absolute;right:calc(24vh + 26px);top:14px;font-size:5.4vh;font-weight:900;text-shadow:0 2px 4px #000}
.coin{display:inline-block;width:5vh;height:5vh;border-radius:50%;background:radial-gradient(#fff3a0,#ffc400 60%,#c98a00);vertical-align:-0.8vh;margin-right:8px;border:2px solid #fff}
#spd{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:3.6vh;font-weight:700;text-shadow:0 2px 4px #000;pointer-events:none}
#spd b{font-size:8vh}
.ctl{position:absolute;bottom:14px;width:21vh;height:21vh;min-width:104px;min-height:104px;border-radius:5vh;background:rgba(255,255,255,.22);border:4px solid rgba(255,255,255,.75);font-size:5vh;font-weight:900;padding:0;overflow:hidden}
.ctl.dn{background:rgba(255,255,255,.55)}
.ctl svg{width:60%;height:60%}
#bL{left:14px}#bR{left:calc(21vh + 30px)}
#bBrake{right:14px;background:rgba(216,30,44,.72)}
#bBrake.dn{background:rgba(255,90,90,.95)}
#bBoost{right:calc(21vh + 30px);background:rgba(20,40,90,.6);font-size:9vh}
#bBoost span{position:relative}
#boostFill{position:absolute;left:0;right:0;bottom:0;height:50%;background:linear-gradient(#ffd91a,#ff7a00)}
#drag{position:absolute;left:0;top:96px;bottom:0;width:50%;display:none}
#knob{position:absolute;width:16vh;height:16vh;margin:-8vh 0 0 -8vh;border-radius:50%;background:rgba(255,255,255,.3);border:4px solid #fff;display:none;pointer-events:none}
#dragHint{position:absolute;left:14px;bottom:14px;font-size:9vh;opacity:.6;pointer-events:none}
.dragmode #bL,.dragmode #bR{display:none}.dragmode #drag{display:block}
#count{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:44vh;font-weight:900;color:#ffd91a;text-shadow:0 1.4vh 0 #c2410c,0 2vh 4vh rgba(0,0,0,.6);pointer-events:none}
#count.pop{animation:pop .5s}
@keyframes pop{from{transform:translate(-50%,-50%) scale(1.8);opacity:.3}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
#lines{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:none;opacity:0;background-size:100% 100%;z-index:5}
#fade{position:absolute;left:0;top:0;right:0;bottom:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s;z-index:6}
/* overlays */
.ov{position:absolute;left:0;top:0;right:0;bottom:0;display:none;z-index:30;background:rgba(8,16,40,.86)}
.ov.on{display:block}
#bKeep{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font-size:9vh;min-height:24vh;padding:0 7vh;border-radius:6vh;white-space:nowrap}
#bKeep:active{transform:translate(-50%,-50%) translateY(4px)}
#setP{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:92%;max-width:880px}
.row{display:flex;align-items:center;margin:9px 0}
.row em{font-style:normal;font-size:26px;font-weight:900;width:170px;flex:none}
.row div{flex:1;display:flex}
.seg{flex:1;min-height:72px;margin-left:10px;border-radius:18px;font-size:24px;font-weight:900;background:rgba(255,255,255,.14);border:3px solid rgba(255,255,255,.3);padding:0 4px}
.seg.sel{background:linear-gradient(#49b6ff,#1668e3);border-color:#fff}
#setX{position:absolute;right:10px;top:10px}
/* results */
#results{background:rgba(8,16,40,.72);text-align:center}
#conf{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
#rIn{position:relative;padding-top:3vh}
#rPlace{font-size:11vh;padding:1vh 90px 0;font-weight:900;color:#ffd91a;line-height:1;text-shadow:0 .8vh 0 #c2410c}
#rStars{font-size:13vh;line-height:1.15;letter-spacing:1vh}
#rStars span{display:inline-block;opacity:.25;filter:grayscale(1)}
#rStars span.got{opacity:1;filter:none;animation:pop2 .6s backwards}
@keyframes pop2{from{transform:scale(3);opacity:0}}
#rInfo{font-size:4.6vh;font-weight:900;margin-top:.5vh}
#rNew{font-size:4.4vh;font-weight:900;color:#7dff8a;min-height:5.4vh}
#rFact{font-size:5.2vh;line-height:1.25;font-weight:700;margin:1.5vh auto 0;max-width:84%;background:rgba(255,255,255,.14);border-radius:3vh;padding:1.6vh 3vh}
/* rotate + nowifi */
#rotate{position:fixed;left:0;top:0;right:0;bottom:0;z-index:90;background:#16337a;display:none;text-align:center;padding-top:22vh}
#rotate svg{width:52vw;height:52vw}
#rotate div{font-size:8vw;font-weight:900;margin-top:4vh}
@media (orientation:portrait){#rotate{display:block}}
#nowifi{position:fixed;left:0;top:0;right:0;bottom:0;z-index:100;background:#16337a;display:none;text-align:center;padding:10vh 6vw}
#nowifi.on{display:block}
#nowifi h2{font-size:9vh;margin:0 0 3vh}
#nowifi p{font-size:5.5vh;margin:0 0 5vh}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="lines"></div><div id="fade"></div>

<div id="title" class="scr on">
  <h1>STAMFORD<span>STREET RACERS</span></h1>
  <p>Race the real streets of Stamford, Connecticut!</p>
  <div id="troad"></div><div id="tcar">&#128663;</div>
  <button id="bPlay" class="btn green">&#9654; PLAY</button>
</div>

<div id="map" class="scr">
  <svg id="mapsvg" viewBox="0 0 1000 600" preserveAspectRatio="none">
    <rect width="1000" height="600" fill="#9ad873"/>
    <path d="M0,0H1000V175C820,205 640,160 480,192S160,172 0,205Z" fill="#5fae4f"/>
    <g id="mapTrees" fill="#3d8a3a"></g>
    <path d="M0,498C90,476 170,508 260,492S380,474 430,494L446,470 462,500 480,468 498,496C560,470 610,506 680,484S760,462 790,478L812,452 836,480C900,452 950,470 1000,456V600H0Z" fill="#3aa0e8"/>
    <path d="M60,548q20,-12 40,0t40,0M300,560q20,-12 40,0t40,0M620,545q20,-12 40,0t40,0M840,560q20,-12 40,0t40,0" stroke="#bfe6ff" stroke-width="4" fill="none"/>
    <path d="M0,196C300,170 620,214 1000,150" stroke="#f3ecd2" stroke-width="9" fill="none"/>
    <path d="M440,395C432,290 412,180 398,30" stroke="#fff" stroke-width="5" fill="none"/>
    <path d="M418,395C380,300 330,200 300,30" stroke="#fff" stroke-width="5" fill="none"/>
    <path d="M470,395C540,330 600,290 700,225" stroke="#fff" stroke-width="5" fill="none"/>
    <path d="M0,438C250,420 520,446 760,412S940,380 1000,372" stroke="#f4a52a" stroke-width="13" fill="none"/>
    <path d="M0,458C250,440 520,466 760,432S940,400 1000,392" stroke="#333" stroke-width="6" stroke-dasharray="14 8" fill="none"/>
    <g fill="#7f93b8" stroke="#fff" stroke-width="1.5"><rect x="372" y="352" width="16" height="34"/><rect x="392" y="340" width="18" height="46"/><rect x="414" y="356" width="14" height="30"/><rect x="432" y="344" width="18" height="42"/><rect x="454" y="358" width="14" height="28"/></g>
    <g font-family="Trebuchet MS,Arial" font-weight="900" fill="#fff" stroke="#16337a" stroke-width="5" paint-order="stroke" text-anchor="middle">
      <text x="760" y="120" font-size="28">North Stamford Woods</text>
      <text x="150" y="182" font-size="19">Merritt Parkway</text>
      <text x="150" y="424" font-size="21">I-95</text>
      <text x="880" y="418" font-size="19">Train</text>
      <text x="270" y="352" font-size="22">Downtown</text>
      <text x="500" y="582" font-size="30">Long Island Sound</text>
    </g>
  </svg>
  <div id="pins"></div>
  <div id="mapT">Meet the Map</div>
  <div id="mapStars">&#11088; 0</div>
  <button id="mGar" class="btn blue bl">&#128663; Cars</button>
  <button id="mSet" class="btn blue br">&#9881; Settings</button>
</div>

<div id="garage" class="scr">
  <div id="gname"></div>
  <button id="gBack" class="ib">Map</button>
  <div id="gCols"></div>
  <div id="gStats"><div id="gBars"></div><button id="gWheel" class="btn blue">Wheels 1</button></div>
  <div id="gLock"></div>
  <button id="gPrev" class="btn blue">&#9664;</button><button id="gNext" class="btn blue">&#9654;</button>
  <div id="gNum"></div>
  <button id="gGo" class="btn green br">GO! &#127937;</button>
</div>

<div id="hud" class="scr">
  <div id="drag"><div id="knob"></div><div id="dragHint">&#8596;</div></div>
  <button id="bPause" class="ib">&#10074;&#10074;</button>
  <button id="bCam" class="ib">&#127909;</button>
  <div id="posBox"><div id="pos">4th</div><div id="lap">Lap 1/3</div></div>
  <div id="coinBox"><i class="coin"></i><span id="coins">0</span></div>
  <canvas id="mini" width="160" height="160"></canvas>
  <div id="spd"><b id="spdN">0</b> mph</div>
  <button id="bL" class="ctl"><svg viewBox="0 0 10 10"><path d="M8,1L2,5L8,9Z" fill="#fff"/></svg></button>
  <button id="bR" class="ctl"><svg viewBox="0 0 10 10"><path d="M2,1L8,5L2,9Z" fill="#fff"/></svg></button>
  <button id="bBoost" class="ctl"><div id="boostFill"></div><span>&#128640;</span></button>
  <button id="bBrake" class="ctl">STOP</button>
  <div id="count"></div>
</div>

<div id="results" class="scr">
  <canvas id="conf"></canvas>
  <div id="rIn">
    <div id="rPlace">1st!</div>
    <div id="rStars"><span>&#11088;</span><span>&#11088;</span><span>&#11088;</span></div>
    <div id="rInfo"></div><div id="rNew"></div>
    <div id="rFact"></div>
  </div>
  <button id="rAgain" class="btn blue bl">&#8635; Again</button>
  <button id="rMap" class="btn green br">Map &#9654;</button>
</div>

<div id="pause" class="ov">
  <button id="bKeep" class="btn green">&#9654; Keep Driving</button>
  <button id="pQuit" class="btn blue bl">&#9664; Map</button>
  <button id="pSet" class="btn blue br">&#9881; Settings</button>
</div>

<div id="settings" class="ov">
  <button id="setX" class="btn green">OK &#10004;</button>
  <div id="setP"></div>
</div>

<button id="mute" class="ib">&#128266;</button>

<div id="rotate">
  <svg viewBox="0 0 100 100"><rect x="34" y="12" width="32" height="52" rx="4" fill="none" stroke="#fff" stroke-width="3" opacity=".45"/><rect x="18" y="62" width="64" height="30" rx="4" fill="#ffd91a" stroke="#fff" stroke-width="3"/><path d="M72,22q18,8 14,32" fill="none" stroke="#fff" stroke-width="4"/><path d="M80,56l7,-9l5,10z" fill="#fff"/></svg>
  <div>Turn me sideways!</div>
</div>

<div id="nowifi">
  <h2 id="nwT">&#128663; Oops! No Wi-Fi</h2>
  <p id="nwP">Ask a grown-up to connect to Wi-Fi, then tap the button.</p>
  <button class="btn green" style="font-size:7vh;min-height:18vh;padding:0 8vh" onclick="location.reload()">&#8635; Try Again</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(function(){
'use strict';
function $(id){return document.getElementById(id);}
if(typeof THREE==='undefined'){$('nowifi').className='on';return;}

/* ================= 1. HELPERS ================= */

var _v=new THREE.Vector3(),_n=new THREE.Vector3(),_m=new THREE.Matrix4(),_nm=new THREE.Matrix3(),_q=new THREE.Quaternion(),_e=new THREE.Euler(),_s=new THREE.Vector3(),_p=new THREE.Vector3();

var U={box:new THREE.BoxGeometry(1,1,1).toNonIndexed(),cyl:new THREE.CylinderGeometry(1,1,1,10).toNonIndexed(),cyl14:new THREE.CylinderGeometry(1,1,1,14).toNonIndexed(),
  cyl8:new THREE.CylinderGeometry(1,1,1,8).toNonIndexed(),cyl6:new THREE.CylinderGeometry(1,1,1,6,1,true).toNonIndexed(),tap:new THREE.CylinderGeometry(.8,1,1,10).toNonIndexed(),
  ico:new THREE.IcosahedronGeometry(1,0),cone:new THREE.ConeGeometry(1,1,7).toNonIndexed()};
if(U.ico.index)U.ico=U.ico.toNonIndexed();

/* Geometry builder: merges primitives into one vertex-coloured BufferGeometry */
function GB(){this.p=[];this.n=[];this.c=[];}
GB.prototype.add=function(geo,m,col,grad){
  var g=geo.index?geo.toNonIndexed():geo,pa=g.attributes.position,na=g.attributes.normal,ca=g.attributes.color,c=C(col===undefined?0xffffff:col),i,f;

    _v.fromBufferAttribute(pa,i);_n.fromBufferAttribute(na,i);

    f=grad?lerp(grad[2],1,clamp((_v.y-grad[0])/(grad[1]-grad[0]),0,1)):1;
    if(ca)this.c.push(ca.getX(i)*c.r*f,ca.getY(i)*c.g*f,ca.getZ(i)*c.b*f);else this.c.push(c.r*f,c.g*f,c.b*f);
  }
  if(g!==geo)g.dispose();return this;};
GB.prototype.box=function(w,h,d,x,y,z,col,ry,rx,rz){return this.add(U.box,MX(x,y,z,w,h,d,ry,rx,rz),col);};
GB.prototype.cyl=function(r,h,x,y,z,col,ax,geo){return this.add(geo||U.cyl,MX(x,y,z,r,h,r,0,ax==='z'?PI/2:0,ax==='x'?PI/2:0),col);};

  R.camH+=wrap((me.va+me.h)/2+(Math.abs(wrap(me.va-me.h))>2?PI:0)-R.camH)*Math.min(1,dt*5.5);
  R.camH=R.camH+wrap(me.h-R.camH)*0;fx=Math.sin(R.camH);fz=Math.cos(R.camH);
  var shake=(sp>.72||R.boosting)?(sp-.6)*.14:0,sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;
  if(R.bumper){cam.position.set(me.x+Math.sin(me.h)*.5+sx,me.y+1.18+sy,me.z+Math.cos(me.h)*.5);cam.lookAt(me.x+Math.sin(me.h)*30,me.y+.9+Math.sin(me.slope)*30,me.z+Math.cos(me.h)*30);me.mesh.userData.body.visible=false;}
  else{var back=6.2+me.v*.11+(R.boosting?1.2:0),up=2.5+me.v*.028;cam.position.set(me.x-fx*back+sx,me.y+up+sy,me.z-fz*back);cam.lookAt(me.x+fx*5,me.y+1.1,me.z+fz*5);me.mesh.userData.body.visible=true;}
  cam.fov=lerp(cam.fov,60+sp*17+(R.boosting?5:0),Math.min(1,dt*4));cam.updateProjectionMatrix();
  R.sky.position.copy(cam.position);
  /* items */
  for(i=0;i<T.items.length;i++){var it=T.items[i];if(!it.on&&!it.was)continue;it.was=it.on;if(it.on){it.mesh.setMatrixAt(it.ix,MX(it.x,it.y+Math.sin(R.time*3+it.ph)*.15,it.z,it.star?1.15:1,it.star?1.15:1,it.star?1.15:1,R.time*2.6+it.ph));it.mesh.instanceMatrix.needsUpdate=true;}}
  for(i=0;i<T.anim.length;i++)T.anim[i](R.time);
  /* drift marks + smoke */
  var drift=Math.abs(me.slip)>.105&&me.v>7&&R.phase!=='count',mk=R.mk,smk=R.sm,lx=Math.cos(me.h),lz=-Math.sin(me.h),rx=me.x-Math.sin(me.h)*me.spec.L*.3,rz=me.z-Math.cos(me.h)*me.spec.L*.3,side,wx,wz,L,o,p;
  for(side=0;side<2;side++){wx=rx+lx*(side?-1:1)*(me.spec.W/2-.2);wz=rz+lz*(side?-1:1)*(me.spec.W/2-.2);L=mk.last[side];
    if(drift){if(L){o=(mk.n%mk.max)*18;p=mk.pos;var y0=L[1]+.04,y1=me.y+.04,ax=L[0]-lx*.15,az=L[2]-lz*.15,bx=L[0]+lx*.15,bz=L[2]+lz*.15,cx=wx+lx*.15,cz=wz+lz*.15,ex=wx-lx*.15,ez=wz-lz*.15;
        p[o]=ax;p[o+1]=y0;p[o+2]=az;p[o+3]=bx;p[o+4]=y0;p[o+5]=bz;p[o+6]=cx;p[o+7]=y1;p[o+8]=cz;p[o+9]=ax;p[o+10]=y0;p[o+11]=az;p[o+12]=cx;p[o+13]=y1;p[o+14]=cz;p[o+15]=ex;p[o+16]=y1;p[o+17]=ez;mk.n++;mk.geo.attributes.position.needsUpdate=true;}
      mk.last[side]=[wx,me.y,wz];
      if(frameN%3===side){o=(smk.n++%smk.max);smk.pos[o*3]=wx;smk.pos[o*3+1]=me.y+.3;smk.pos[o*3+2]=wz;smk.life[o]=.7;}}
    else mk.last[side]=null;}
  for(i=0;i<smk.max;i++)if(smk.life[i]>0){smk.life[i]-=dt;smk.pos[i*3+1]+=dt*1.6;if(smk.life[i]<=0)smk.pos[i*3+1]=-200;}
  smk.geo.attributes.position.needsUpdate=true;
  /* hud */
  hudSet('pos',ORD[me.place-1]);hudSet('lap','Lap '+clamp(me.lap,1,LAPS)+'/'+LAPS);hudSet('spdN',Math.round(me.v*7));
  b=Math.round(R.boost*100);if(hudCache.boost!==b){hudCache.boost=b;$('boostFill').style.height=b+'%';}
  $('lines').style.opacity=clamp((sp-.66)*2.2,0,.75)+(R.boosting?.25:0);
  if(frameN%2===0){var mc=$('mini'),x=mc.getContext('2d'),mm=T.mini;x.clearRect(0,0,160,160);x.drawImage(mm.c,0,0);
    for(i=R.cars.length-1;i>=0;i--){c=R.cars[i];x.beginPath();x.arc(c.x*mm.sc+mm.ox,c.z*mm.sc+mm.oz,c===me?7:4.5,0,6.3);x.fillStyle=c===me?'#ffd91a':'#ff5a4d';x.fill();if(c===me){x.lineWidth=2;x.strokeStyle='#000';x.stroke();}}}
  engineUpdate(me.v,me.st.vmax,me.slip,R.boosting,paused||state!=='race');
}

/* ================= 11. UI / SCREENS ================= */
function show(s){state=s;['title','map','garage','hud','results'].forEach(function(n){$(n).classList.toggle('on',n===(s==='race'?'hud':s));});}
function tap(id,fn){$(id).addEventListener('click',function(e){e.preventDefault();audioInit();fn(e);});}
function hold(id,key){var el=$(id);
  function on(e){e.preventDefault();touch[key]=1;el.classList.add('dn');try{el.setPointerCapture(e.pointerId);}catch(x){}}
  function off(){touch[key]=0;el.classList.remove('dn');}
  el.addEventListener('pointerdown',on);el.addEventListener('pointerup',off);el.addEventListener('pointercancel',off);el.addEventListener('lostpointercapture',off);}
function goFull(){var e=document.documentElement,f=e.requestFullscreen||e.webkitRequestFullscreen,p;
  try{if(f&&!(document.fullscreenElement||document.webkitFullscreenElement)){p=f.call(e);if(p&&p.catch)p.catch(function(){});}}catch(x){}
  try{if(screen.orientation&&screen.orientation.lock){p=screen.orientation.lock('landscape');if(p&&p.catch)p.catch(function(){});}}catch(x){}}
/* map */
function buildMap(){var h='',r=mulberry(5),i,g='';
  for(i=0;i<90;i++){var x=r()*1000,y=r()*165+6;g+='<circle cx="'+x.toFixed(0)+'" cy="'+y.toFixed(0)+'" r="'+(7+r()*6).toFixed(0)+'"/>';}
  for(i=0;i<40;i++)g+='<circle cx="'+(r()*1000).toFixed(0)+'" cy="'+(215+r()*190).toFixed(0)+'" r="6" opacity=".55"/>';
  $('mapTrees').innerHTML=g;
  TRACKS.forEach(function(t,i){h+='<button class="pin'+((t.pin[0]>700||i===3)?' lft':'')+'" id="pin'+i+'" style="left:'+t.pin[0]/10+'%;top:'+t.pin[1]/6+'%"><span></span><i></i></button>';});
  $('pins').innerHTML=h;
  TRACKS.forEach(function(t,i){tap('pin'+i,function(){if(totalStars()<t.need){var p=$('pin'+i);p.classList.remove('shake');void p.offsetWidth;p.classList.add('shake');tone(200,.2,'square',.12);return;}G.track=i;openGarage();});});}
function showMap(){disposeRace();var tot=totalStars();$('mapStars').innerHTML='&#11088; '+tot;
  TRACKS.forEach(function(t,i){var p=$('pin'+i),lock=tot<t.need,s=save.stars[i];p.classList.toggle('lock',lock);
    p.firstChild.innerHTML=lock?'&#128274;':(i+1);
    p.lastChild.innerHTML=t.name+'<br>'+(lock?'<b>Need '+t.need+' &#11088;</b>':'<b>'+'&#9733;'.repeat(s)+'&#9734;'.repeat(3-s)+'</b>');});
  show('map');}
/* garage */
function buildGarage(){var h='',i;for(i=0;i<8;i++)h+='<button class="sw" id="sw'+i+'" style="background:#'+('00000'+PAINT[i].toString(16)).slice(-6)+'"></button>';$('gCols').innerHTML=h;
  for(i=0;i<8;i++)(function(i){tap('sw'+i,function(){var s=CARS[G.idx];save.colors[s.id]=i;store();if(G.car)G.car.userData.paint.color.set(PAINT[i]);garageUI();tone(700+i*60,.1,'sine',.15);});})(i);}
function garageShow(i){G.idx=(i+CARS.length)%CARS.length;var s=CARS[G.idx];
  if(G.car){G.pivot.remove(G.car);disposeTree(G.car);}
  G.car=buildCar(s,PAINT[colorOf(s)],wheelOf(s));G.car.position.y=.25;G.pivot.add(G.car);garageUI();}
function garageUI(){var s=CARS[G.idx],ok=totalStars()>=s.unlock,i,h='',names=['Speed','Zoom','Turn'],j;
  $('gname').innerHTML=s.name+(G.track>=0?'<small>'+TRACKS[G.track].name+'</small>':'');
  for(j=0;j<3;j++){h+='<div class="st">'+names[j]+'<br>';for(i=0;i<5;i++)h+='<u'+(i<s.st[j]?' class="f"':'')+'></u>';h+='</div>';}
  $('gBars').innerHTML=h;$('gWheel').textContent='Wheels '+(wheelOf(s)+1);$('gNum').textContent=(G.idx+1)+' / '+CARS.length;
  for(i=0;i<8;i++)$('sw'+i).classList.toggle('sel',colorOf(s)===i);
  $('gLock').style.display=ok?'none':'block';$('gLock').innerHTML='&#128274; Need '+s.unlock+' &#11088;';
  $('gGo').classList.toggle('off',!ok);$('gGo').innerHTML=G.track>=0?'GO! &#127937;':'OK &#10004;';}
function openGarage(){show('garage');garageShow(carIndex(save.car));resize();}
/* settings */
var SETS=[['assist','Help',['Lots','Some','None']],['diff','Race',['Easy','Medium','Hard']],['steer','Steer',['Buttons','Drag']],['quality','Picture',['Auto','Low','Medium','High']]];
function buildSettings(){var h='';SETS.forEach(function(s){h+='<div class="row"><em>'+s[1]+'</em><div>';s[2].forEach(function(o,i){h+='<button class="seg" id="set_'+s[0]+i+'">'+o+'</button>';});h+='</div></div>';});
  $('setP').innerHTML=h;
  SETS.forEach(function(s){s[2].forEach(function(o,i){tap('set_'+s[0]+i,function(){save.set[s[0]]=i;store();settingsUI();tone(600,.08,'sine',.12);
    if(s[0]==='quality')setQ(i||2);if(s[0]==='steer')$('hud').classList.toggle('dragmode',i===1);});});});}
function settingsUI(){SETS.forEach(function(s){s[2].forEach(function(o,i){$('set_'+s[0]+i).classList.toggle('sel',save.set[s[0]]===i);});});}
/* pause */
function pause(){if(state!=='race'||paused||!R)return;paused=true;$('pause').classList.add('on');engineUpdate(0,1,0,false,true);}
function resume(){paused=false;$('pause').classList.remove('on');$('settings').classList.remove('on');last=0;}
/* results */
var confT=0,confP=[];
function showResults(){var me=R.me,place=me.fin||me.place,max=R.T.items.length*LAPS,stars=1,before=totalStars(),ti=R.ti,i,news=[];
  var got=0;R.T.items.forEach(function(){});got=R.coins;
  if(place<=3||got>=max*.5)stars=2;if(place===1)stars=3;
  if(stars>save.stars[ti])save.stars[ti]=stars;store();var after=totalStars();
  CARS.forEach(function(c){if(c.unlock>before&&c.unlock<=after)news.push('New car: '+c.name+'!');});
  TRACKS.forEach(function(t){if(t.need>before&&t.need<=after)news.push('New track: '+t.name+'!');});
  $('rPlace').textContent=ORD[place-1]+(place===1?' Place! You Win!':' Place! Great Driving!');
  var sp=$('rStars').children;for(i=0;i<3;i++){sp[i].className='';void sp[i].offsetWidth;if(i<stars){sp[i].className='got';sp[i].style.animationDelay=(.3+i*.35)+'s';}}
  $('rInfo').innerHTML='<i class="coin"></i>'+got+' coins';$('rNew').textContent=news.slice(0,2).join('  ');$('rFact').textContent=R.spec.fact;
  show('results');confP=[];for(i=0;i<130;i++)confP.push({x:Math.random(),y:-Math.random(),v:.25+Math.random()*.35,w:Math.random()*6.28,c:['#ffd91a','#ff4d4d','#39b6ff','#6fe06a','#ff8ad1','#fff'][i%6],s:6+Math.random()*8});confT=9;
  for(i=0;i<stars;i++)tone(880+i*220,.25,'triangle',.18,.3+i*.35);}
function confetti(dt){var c=$('conf'),w=c.clientWidth,h=c.clientHeight,x,i,p;if(c.width!==w){c.width=w;c.height=h;}x=c.getContext('2d');x.clearRect(0,0,w,h);if(confT<=0)return;confT-=dt;
  for(i=0;i<confP.length;i++){p=confP[i];p.y+=p.v*dt;p.w+=dt*5;if(p.y>1.05){p.y=-.05;p.x=Math.random();}x.save();x.translate(p.x*w+Math.sin(p.w)*18,p.y*h);x.rotate(p.w);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66);x.restore();}}

/* wire up */
buildMap();buildGarage();buildSettings();settingsUI();setMute(save.set.mute);
(function(){var c=mkCanvas(320,180),x=c.getContext('2d'),r=mulberry(3),i,a,d0,d1;x.strokeStyle='rgba(255,255,255,.8)';
  for(i=0;i<70;i++){a=r()*6.28;d0=.62+r()*.25;d1=d0+.12+r()*.25;x.lineWidth=1+r()*1.5;x.beginPath();x.moveTo(160+Math.cos(a)*d0*190,90+Math.sin(a)*d0*110);x.lineTo(160+Math.cos(a)*d1*190,90+Math.sin(a)*d1*110);x.stroke();}
  $('lines').style.backgroundImage='url('+c.toDataURL()+')';})();
tap('bPlay',function(){goFull();showMap();tone(660,.12,'square',.15);tone(990,.25,'square',.15,.1);});
tap('mute',function(){setMute(!save.set.mute);});
tap('mGar',function(){G.track=-1;openGarage();});
tap('mSet',function(){$('settings').classList.add('on');});
tap('setX',function(){$('settings').classList.remove('on');});
tap('gBack',function(){showMap();});
tap('gPrev',function(){garageShow(G.idx-1);tone(520,.08,'sine',.14);});
tap('gNext',function(){garageShow(G.idx+1);tone(620,.08,'sine',.14);});
tap('gWheel',function(){var s=CARS[G.idx];save.wheels[s.id]=(wheelOf(s)+1)%3;store();garageShow(G.idx);});
tap('gGo',function(){var s=CARS[G.idx];if(totalStars()<s.unlock){tone(200,.2,'square',.12);return;}save.car=s.id;store();
  if(G.car){G.pivot.remove(G.car);disposeTree(G.car);G.car=null;}
  if(G.track>=0){goFull();startRace(G.track);}else showMap();});
tap('bPause',function(){pause();});
tap('bCam',function(){if(R)R.bumper=!R.bumper;});
tap('bKeep',function(){goFull();resume();});
tap('pQuit',function(){resume();showMap();});
tap('pSet',function(){$('settings').classList.add('on');});
tap('rAgain',function(){startRace(R?R.ti:0);});
tap('rMap',function(){showMap();});
hold('bL','l');hold('bR','r');hold('bBrake','brake');hold('bBoost','boost');
(function(){var z=$('drag'),k=$('knob'),id=null,sx=0;
  z.addEventListener('pointerdown',function(e){if(id!==null)return;id=e.pointerId;sx=e.clientX;try{z.setPointerCapture(id);}catch(x){}k.style.display='block';k.style.left=e.clientX+'px';k.style.top=(e.clientY-z.offsetTop)+'px';});
  z.addEventListener('pointermove',function(e){if(e.pointerId!==id)return;touch.drag=clamp((sx-e.clientX)/(window.innerWidth*.1),-1,1);k.style.left=e.clientX+'px';});
  function end(e){if(e.pointerId!==id)return;id=null;touch.drag=0;k.style.display='none';}
  z.addEventListener('pointerup',end);z.addEventListener('pointercancel',end);})();
window.addEventListener('keydown',function(e){keys[e.key]=1;if(e.key.indexOf('Arrow')===0||e.key===' ')e.preventDefault();if(e.key==='Escape'||e.key==='p'){if(paused)resume();else pause();}});
window.addEventListener('keyup',function(e){keys[e.key]=0;});
['contextmenu','gesturestart','dblclick','selectstart','dragstart'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault();});});
document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
document.addEventListener('visibilitychange',function(){if(document.hidden){pause();if(AU.ctx&&AU.ctx.state==='running')AU.ctx.suspend();}else if(AU.ctx)AU.ctx.resume();});
window.addEventListener('blur',function(){pause();});
if(window.matchMedia){var mq=window.matchMedia('(orientation:portrait)'),mf=function(){if(mq.matches)pause();};if(mq.addEventListener)mq.addEventListener('change',mf);else if(mq.addListener)mq.addListener(mf);}

/* ================= 12. MAIN LOOP ================= */
var last=0,accum=0;
function frame(t){
  requestAnimationFrame(frame);
  var dt=last?Math.min(.1,(t-last)/1000):0,n=0;last=t;
  if(state==='race'||state==='results'){
    if(R&&!paused){
      accum+=dt;while(accum>=STEP&&n<5){physics(STEP);accum-=STEP;n++;if(!R)return;}if(n===5)accum=0;
      visuals(dt);renderer.render(R.scene,cam);
      /* auto quality: average fps over 3 seconds */
      if(state==='race'&&R.phase==='run'){R.fps.t+=dt;R.fps.n++;if(R.fps.t>=3){if(R.fps.n/R.fps.t<28&&save.set.quality===0&&ql>1)setQ(ql-1);R.fps.t=0;R.fps.n=0;}}
    }
    if(state==='results')confetti(dt);
  }else if(state==='garage'&&G.car){
    G.t+=dt;G.pivot.rotation.y+=dt*.7;
    G.car.userData.doors.forEach(function(d){var a=(Math.sin(G.t*1.3)*.5+.5);d.rotation.x=a*1.05;d.rotation.z=-d.userData.sd*a*.3;});
    renderer.render(G.scene,G.cam);
  }
}
setQ(ql);requestAnimationFrame(frame);
})();
</script>
